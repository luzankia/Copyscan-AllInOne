<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🔒 PIN required</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; color: #fff; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 32px; max-width: 360px; width: 100%; text-align: center; box-sizing: border-box; }
        .card h2 { margin: 0 0 8px 0; }
        .card p { margin: 0 0 24px 0; color: #aaa; font-size: 13px; }
        .pin-input { width: 100%; height: 46px; background: #0f0f0f; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 20px; letter-spacing: 4px; text-align: center; box-sizing: border-box; margin-bottom: 16px; }
        .pin-input:focus { outline: none; border-color: #3b82f6; }
        .error-msg { color: #ef4444; font-size: 13px; margin: -8px 0 16px 0; min-height: 18px; }
        .btn { width: 100%; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; height: 46px; }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 PIN required</h2>
        <form method="POST" action="/pin_verify" autocomplete="off">
            <input class="pin-input" type="password" name="pin" placeholder="••••" autofocus autocomplete="off" />
            <p class="error-msg">{% if error %}Wrong PIN, try again.{% endif %}</p>
            <button class="btn" type="submit">Unlock</button>
        </form>
    </div>
</body>
</html>
