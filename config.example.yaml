# Global Configuration
# Copy this file to "config.yaml" and adjust every path below to your own setup.
root_dir: "C:\\Path\\To\\Your\\Input"
dest_dir: "C:\\Path\\To\\Your\\Output"
csv_1_path: "C:\\Path\\To\\Your\\Project\\exception.txt"
csv_2_path: "C:\\Path\\To\\Your\\Project\\batchexception.txt"
log_path: "C:\\Path\\To\\Your\\Project\\workflow.log"
log_enabled: true
credit_hashes_path: "C:\\Path\\To\\Your\\Project\\credit_hashes.json"
credit_hash_threshold: 8  # Max perceptual-hash distance (0-64) to consider a page a known credit page
credit_banners_path: "C:\\Path\\To\\Your\\Project\\credit_banners.json"
credit_banner_threshold: 16  # Max perceptual-hash distance (0-64) for embedded top/bottom banner detection
trash_dir: "C:\\Path\\To\\Your\\Project\\trash"  # Recycle bin for every deletion/cut/merge made in the Step 2 Web UI 

# Supported extension in the workflow
supported_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".webp"
  - ".avif"
  - ".bmp"
  - ".gif"

# Timing & Ports
sleep_time: 1
im_timeout: 20
web_port: 5002  # Shared by the main Web UI and the standalone hash_maintenance.py tool.
                # If already taken (e.g. both running at once), the next free port is used automatically.
web_ui_network_access: false
mobile_mini_mode: false 
thumb_size: "220px"

# Workflow Steps Activation
steps_active:
  step_1: true  # Integrity Check (ImageMagick)
  step_2: true  # Manual Sort via Web Interface
  step_3: true  # Cleanup via Regex (Files)
  step_4: true  # Delete Empty Folders
  step_5: true  # Rename Leaf Folders (Regex)
  step_6: true  # Renumber Leaf Folder Files (fill numbering gaps)
  step_7: true  # Compress Leaf Folders to CBZ (7-Zip)
  step_8: true  # Rename/Suffix Parent2 via CSV
  step_9: true  # Move to destination & Final Cleanup

# Security Configurations
mask_security_popups: false

# Chapter Editor / Split Studio keyboard shortcuts 
# https://developer.mozilla.org/en-US/docs/Web/API/UI_Events/Keyboard_event_key_values
keyboard_shortcuts:
  prev_chapter: "ArrowLeft"
  next_chapter: "ArrowRight"
  delete_selection: "Delete"
  remember_credit: "C"
  merge_pairs: "M"
  validate_merges: "V"
  execute_split: "X"

# Regex configurations
delete_regex:
  - '^\.nomedia$'

# Rename Leaf Folders (First match applies)
rename_regex:
  - pattern: '^(?:.*_)?(?:Chapter|Ch\.)\s*(\d+(?:\.\d+)?)\s+-\s+Episode\s+\d+(?:\.\d+)?(.*)'
    replacement: 'Ch.\1\2'
  - pattern: '^(?:.*_)?Chapter\s+(\d+(?:\.\d+)?)(.*)'
    replacement: 'Ch.\1\2'
  - pattern: '^.*_((?:Vol\.\d+\s+)?Ch\.\d+.*)'
    replacement: '\1'
  - pattern: '^.*_Volume\s+\d+\s+Chapter\s+(\d+(?:\.\d+)?)\s+_\s+(.*)'
    replacement: 'Ch.\1 - \2'
  - pattern: '^Episode\s+\d+\s+\((ch\.\s+\d+)\)(.*)'
    replacement: '\1\2'
  - pattern: '^\((S\d+)\)\s+Ep\.\s+\d+\s+(.*?)\s*\((ch\.\s+\d+)\)(.*)'
    replacement: '\1 \3 \2\4'
  - pattern: '^Ep\.\d+\s+\((ch\.\s+\d+)\)(.*)'
    replacement: '\1\2'
  - pattern: '^Ep\.\s*\d+\s+-\s+(.*?)\s*\((ch\.\s*\d+)\)(.*)'
    replacement: '\2 - \1\3'
